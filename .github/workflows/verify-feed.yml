name: verify-feed

# Re-check the PUBLISHED release (signature with the public key in keys/, checksums, install
# metadata) in an OpenWrt container. Manual, and weekly to notice changes on GitHub's side.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: tests/opkg-published.sh
