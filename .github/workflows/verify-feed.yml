name: verify-feed

# Re-check the PUBLISHED feed the way a router uses it (https, redirects, signature,
# downloads). Manual, and weekly to notice changes on GitHub's side.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Pin the addresses this runner can reach (the container resolver sometimes returns unreachable ones)
        run: |
          set -eu
          url=https://github.com/0xfe10/wharf/releases/latest/download/Packages.gz
          gh_ip=$(curl -sS -o /dev/null --connect-timeout 15 -w '%{remote_ip}' "$url")
          asset_url=$(curl -sS -o /dev/null --connect-timeout 15 -L -w '%{url_effective}' "$url")
          asset_host=$(echo "$asset_url" | sed -E 's#^https://([^/]+)/.*#\1#')
          asset_ip=$(curl -sS -o /dev/null --connect-timeout 15 -L -w '%{remote_ip}' "$url")
          echo "github.com=$gh_ip $asset_host=$asset_ip"
          echo "ADD_HOSTS=--add-host github.com:$gh_ip --add-host $asset_host:$asset_ip" >> "$GITHUB_ENV"
      - run: tests/opkg-published.sh
