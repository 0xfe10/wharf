name: release

# Push a tag like v1.0.0 to publish: the GitHub release (title = tag) holds every
# package plus Packages / Packages.gz, and becomes "latest". Routers use
# https://github.com/0xfe10/wharf/releases/latest/download as the opkg feed.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m unittest discover tests -v
      - run: node tests/view-eval.js
      - name: Build feed
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tools/build-all --out site
          ls -l site/feed
      - name: Build usign
        run: echo "USIGN=$(tools/build-usign "$RUNNER_TEMP/usign")" >> "$GITHUB_ENV"
      - name: opkg round-trip in an OpenWrt container (signature checking on)
        run: tests/opkg-install.sh site
      - name: Sign the feed
        env:
          WHARF_USIGN_KEY: ${{ secrets.WHARF_USIGN_KEY }}
        run: |
          set -eu
          [ -n "$WHARF_USIGN_KEY" ] || { echo "secret WHARF_USIGN_KEY is empty"; exit 1; }
          key="$RUNNER_TEMP/wharf.key"
          umask 077
          printf '%s\n' "$WHARF_USIGN_KEY" > "$key"
          tools/sign-feed "$USIGN" "$key" site/feed
          rm -f "$key"
          # the published signature must verify with the committed public key
          "$USIGN" -V -p keys/wharf-usign.pub -m site/feed/Packages -x site/feed/Packages.sig
          cp keys/wharf-usign.pub site/feed/wharf-usign.pub
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" site/feed/* \
            --title "$GITHUB_REF_NAME" --generate-notes --latest --verify-tag
