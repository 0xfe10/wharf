name: release

# Push a tag like v1.0.0 to publish: the GitHub release (title = tag) holds every
# package plus Packages / Packages.gz / Packages.sig, and becomes "latest". Routers use
# https://0xfe10.github.io/wharf as the opkg feed (the pages workflow publishes the latest release there).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 -m unittest discover tests -v
      - run: node tests/view-eval.js
      - name: Build feed
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tools/build-all --out site
          ls -l site/feed
      - name: Changed packages must have a new version
        run: tools/check-versions --built site/feed
      - name: Build usign
        run: echo "USIGN=$(tools/build-usign "$RUNNER_TEMP/usign")" >> "$GITHUB_ENV"
      - name: opkg round-trip in an OpenWrt container (signature checking on)
        run: tests/opkg-install.sh site
      - name: Sign the feed
        env:
          WHARF_USIGN_KEY: ${{ secrets.WHARF_USIGN_KEY }}
        run: |
          set -eu
          [ -n "$WHARF_USIGN_KEY" ] || { echo "secret WHARF_USIGN_KEY is empty"; exit 1; }
          key="$RUNNER_TEMP/wharf.key"
          umask 077
          printf '%s\n' "$WHARF_USIGN_KEY" > "$key"
          tools/sign-feed "$USIGN" "$key" site/feed
          rm -f "$key"
          # the published signature must verify with the committed public key
          "$USIGN" -V -p keys/wharf-usign.pub -m site/feed/Packages -x site/feed/Packages.sig
          cp keys/wharf-usign.pub site/feed/wharf-usign.pub
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" site/feed/* \
            --title "$GITHUB_REF_NAME" --generate-notes --latest --verify-tag

      - name: Publish the feed on GitHub Pages (the URL routers use)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  # What a router does, against the real public URL (redirects, https, signature).
  verify-published:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: opkg update/download from the published feed with signature checking on
        run: tests/opkg-published.sh
