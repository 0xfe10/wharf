name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 -m unittest discover tests -v
      - run: node tests/view-eval.js

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build feeds
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tools/build-all --out site
          find site -type f | sort
      - name: Changed packages must have a new version
        run: tools/check-versions --built site/feed
      - name: Dependencies are available from the GL.iNet feeds
        # depends on fw.gl-inet.com being reachable, so a failure here is a warning
        continue-on-error: true
        run: python3 tests/check-glinet-deps.py --ours site/feed/Packages
      - name: Build usign
        run: echo "USIGN=$(tools/build-usign "$RUNNER_TEMP/usign")" >> "$GITHUB_ENV"
      - name: opkg round-trip in an OpenWrt container (signature checking on)
        run: tests/opkg-install.sh site
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          if-no-files-found: error
